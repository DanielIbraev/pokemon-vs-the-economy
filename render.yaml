services:
  - type: web
    name: pokemon-vs-stocks
    runtime: python
    buildCommand: |
      pip install -r requirements.txt &&
      cd frontend && npm install && npm run build
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
    plan: free
